name: CI

# Quality gate for every push and pull request.
#
# Order is deliberate — cheapest and most localised failure first:
#   lint (seconds) -> static analysis (fast) -> tests (slowest) -> security audit
# so a formatting mistake fails in seconds instead of after the full suite.
#
# planning.md NFR-MAINT-01/02 and Universal DoD U-2/U-3/U-4: a red pipeline
# blocks the phase. The level is never lowered and no baseline is added to make
# a failing build pass (Development Rule 9).
#
# Written for GitHub Actions. If the project moves to another CI platform in
# Phase 16, the four steps below transfer unchanged — they are just composer
# scripts.

on:
  push:
    branches: [main, 'phase/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, analyse, test
    runs-on: ubuntu-latest

    # Tests run against a REAL PostgreSQL instance, never SQLite.
    # From Phase 3 the schema depends on JSONB, partial unique indexes and
    # CHECK constraints that SQLite does not implement, so a green SQLite run
    # would be actively misleading (see phpunit.xml).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, exif, fileinfo, gd, intl, mbstring, openssl, pdo_pgsql, pgsql, sodium, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # ── Gate 1: formatting ────────────────────────────────────────────────
      - name: Lint (Pint)
        run: composer lint

      # ── Gate 2: static analysis ───────────────────────────────────────────
      - name: Static analysis (Larastan level 8)
        run: composer analyse

      # ── Gate 3: tests ─────────────────────────────────────────────────────
      - name: Run migrations against PostgreSQL
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lms_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force

      - name: Test (Pest)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lms_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test

  assets:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # NFR-SEC-20: dependencies are scanned for known vulnerabilities, and a
      # critical advisory must be patched before release.
      - name: Composer audit
        run: composer audit --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: npm audit
        run: npm audit --audit-level=high
